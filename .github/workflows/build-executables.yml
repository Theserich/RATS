name: Build Cross-Platform Executables

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller requests

      # Resolves the version from the git tag (e.g. v1.2.3 -> tag "v1.2.3",
      # clean "1.2.3"). Falls back to a dev version for workflow_dispatch runs
      # that aren't building from a tag.
      - name: Compute version
        shell: bash
        run: |
          TAG="${{ github.ref_name }}"
          if [[ "$TAG" == v* ]]; then
            CLEAN="${TAG#v}"
          else
            TAG="v0.0.0-dev.${{ github.run_number }}"
            CLEAN="0.0.0.${{ github.run_number }}"
          fi
          echo "$TAG" > VERSION.txt
          echo "APP_VERSION_TAG=$TAG" >> "$GITHUB_ENV"
          echo "APP_VERSION_CLEAN=$CLEAN" >> "$GITHUB_ENV"

      # Generates the Windows file-properties version resource (Explorer ->
      # Properties -> Details, and Add/Remove Programs) so it's baked into
      # app.exe by PyInstaller. app.spec picks this up automatically if present.
      - name: Generate Windows version resource
        shell: python
        run: |
          import os
          import re

          version = os.environ["APP_VERSION_CLEAN"]
          parts = re.findall(r'\d+', version)
          parts = (parts + ['0', '0', '0', '0'])[:4]
          parts = tuple(int(p) for p in parts)

          content = f"""VSVersionInfo(
            ffi=FixedFileInfo(
              filevers={parts},
              prodvers={parts},
              mask=0x3f,
              flags=0x0,
              OS=0x40004,
              fileType=0x1,
              subtype=0x0,
              date=(0, 0)
            ),
            kids=[
              StringFileInfo(
                [
                StringTable(
                  u'040904B0',
                  [StringStruct(u'CompanyName', u'Theserich'),
                  StringStruct(u'FileDescription', u'RATS'),
                  StringStruct(u'FileVersion', u'{version}'),
                  StringStruct(u'ProductName', u'RATS'),
                  StringStruct(u'ProductVersion', u'{version}')])
                ]),
              VarFileInfo([VarStruct(u'Translation', [1033, 1200])])
            ]
          )"""

          with open("version_info.txt", "w") as f:
              f.write(content)

      - name: Build executable
        run: pyinstaller --noconfirm app.spec

      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y

      - name: Compile Inno Setup Installer
        run: |
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" /DMyAppVersion="${{ env.APP_VERSION_CLEAN }}" installer.iss

      - name: Prepare zip contents
        run: |
          mkdir zip-content
          copy dist\app.exe zip-content\
          if (Test-Path "Library") {
            copy -Recurse Library zip-content\Library
          }
          if (Test-Path "UIFiles") {
            copy -Recurse UIFiles zip-content\UIFiles
          }

      - name: Zip build
        run: |
          Compress-Archive -Path zip-content\* -DestinationPath app-${{ github.ref_name }}-windows-x64.zip

      # Upload ZIP artifact
      - name: Upload Windows Zip
        uses: actions/upload-artifact@v4
        with:
          name: windows-zip
          path: app-${{ github.ref_name }}-windows-x64.zip
          retention-days: 30

      # Upload Installer artifact separately
      - name: Upload Windows Installer
        uses: actions/upload-artifact@v4
        with:
          name: windows-installer
          path: installer-output/RATS_Setup.exe
          retention-days: 30

  build-macos:
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller requests

      - name: Compute version
        shell: bash
        run: |
          TAG="${{ github.ref_name }}"
          if [[ "$TAG" == v* ]]; then
            CLEAN="${TAG#v}"
          else
            TAG="v0.0.0-dev.${{ github.run_number }}"
            CLEAN="0.0.0.${{ github.run_number }}"
          fi
          echo "$TAG" > VERSION.txt
          echo "APP_VERSION_TAG=$TAG" >> "$GITHUB_ENV"
          echo "APP_VERSION_CLEAN=$CLEAN" >> "$GITHUB_ENV"

      - name: Build executable
        run: pyinstaller --noconfirm app.spec

      - name: Prepare zip contents
        run: |
          mkdir zip-content
          cp dist/app zip-content/
          if [ -d "Library" ]; then
            cp -R Library zip-content/Library
          fi
          if [ -d "UIFiles" ]; then
            cp -R UIFiles zip-content/UIFiles
          fi

      - name: Zip build
        run: |
          cd zip-content
          zip -r ../app-${{ github.ref_name }}-macos-x64.zip .

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: macos-executable
          path: app-${{ github.ref_name }}-macos-x64.zip
          retention-days: 30

  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: [build-windows, build-macos]
    runs-on: ubuntu-latest

    steps:
      - name: Download Windows Zip artifact
        uses: actions/download-artifact@v4
        with:
          name: windows-zip
          path: assets

      - name: Download Windows Installer artifact
        uses: actions/download-artifact@v4
        with:
          name: windows-installer
          path: assets

      - name: Download macOS artifact
        uses: actions/download-artifact@v4
        with:
          name: macos-executable
          path: assets

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            assets/app-${{ github.ref_name }}-windows-x64.zip
            assets/RATS_Setup.exe
            assets/app-${{ github.ref_name }}-macos-x64.zip
          name: Release ${{ github.ref_name }}
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}